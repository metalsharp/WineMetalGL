name: GL 3.3 conformance (manual)

on:
  workflow_dispatch:
    inputs:
      wine_runtime:
        description: Absolute path to a Wine 11.x installation on the self-hosted runner (llvm-mingw on PATH)
        required: true
        type: string
      cts_executable:
        description: Absolute path to glcts.exe from a VK-GL-CTS build
        required: true
        type: string
      template_prefix:
        description: Absolute path to a WoW64 template prefix (optional; created if empty)
        required: false
        type: string
      config:
        description: mustpass.xml configuration number (1-4; 5 and 6 repeat 1 and 2)
        required: true
        default: "1"
        type: string
      filter:
        description: Optional case glob, e.g. KHR-GL33.shaders.indexing.*
        required: false
        type: string
      shards:
        description: Parallel shards
        required: true
        default: "7"
        type: string

permissions:
  contents: read

jobs:
  conformance:
    name: KHR-GL33 config ${{ inputs.config }}
    runs-on: [self-hosted, macOS, wine-gl33]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build the core and the Wine module and install them
        env:
          WINE_RUNTIME: ${{ inputs.wine_runtime }}
          TEMPLATE_PREFIX: ${{ inputs.template_prefix }}
        run: |
          set -eu
          ./scripts/build.sh
          ./scripts/build-wine-module.sh "$WINE_RUNTIME"
          # The template prefix gets the forwarding opengl32.dll and its override.
          template=${TEMPLATE_PREFIX:-$RUNNER_TEMP/prefix-template}
          if test ! -d "$template"; then
            WINEPREFIX="$template" WINEARCH=wow64 WINEDLLOVERRIDES="mscoree,mshtml=" "$WINE_RUNTIME/bin/wine" wineboot -u
            WINEPREFIX="$template" "$WINE_RUNTIME/bin/wineserver" -w
          fi
          ./scripts/install-wine-module.sh "$WINE_RUNTIME" "$template"
          echo "TEMPLATE=$template" >> "$GITHUB_ENV"

      - name: Run KHR-GL33
        env:
          WINE_RUNTIME: ${{ inputs.wine_runtime }}
          CTS_EXECUTABLE: ${{ inputs.cts_executable }}
          CONFIG: ${{ inputs.config }}
          FILTER: ${{ inputs.filter }}
          SHARDS: ${{ inputs.shards }}
        run: |
          set -eu
          args="--wine $WINE_RUNTIME --cts $CTS_EXECUTABLE --config $CONFIG --shards $SHARDS --out $RUNNER_TEMP/results.txt"
          args="$args --template $TEMPLATE"
          test -z "$FILTER" || args="$args --filter $FILTER"
          # --strict: any Fail, Crash, Timeout, InternalError or Missing case fails the job.
          status=0
          python3 -I scripts/cts/run.py $args --strict || status=$?
          python3 -I scripts/cts/summary.py "$RUNNER_TEMP/results.txt" --depth 1
          # A full run is also compared with the committed baseline of its configuration.
          baseline=tests/cts/baseline/gl33-cfg$CONFIG-wine.txt
          if test -z "$FILTER" && test -f "$baseline"; then
            python3 -I scripts/cts/diff.py "$baseline" "$RUNNER_TEMP/results.txt" || status=1
          fi
          exit "$status"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gl33-config-${{ inputs.config }}
          path: ${{ runner.temp }}/results.txt
