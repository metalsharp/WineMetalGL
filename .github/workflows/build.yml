name: WineMetalGL build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winemetalgl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake-build:
    name: CMake macOS 15+ x86_64 build
    runs-on: macos-15
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check toolchain
        run: |
          cmake --version
          ninja --version
          clang --version

      - name: Configure with the repository preset
        run: cmake --preset release

      - name: Build the complete project
        run: cmake --build --preset release --parallel 4

      - name: Run core host tests
        run: ./build/release/wmgl_host_tests

      - name: Verify the core exports only the driver ABI and does not use OpenGL.framework
        run: |
          if otool -L build/release/libwinemetalgl.dylib | grep -q OpenGL.framework; then exit 1; fi
          test -z "$(nm -gU build/release/libwinemetalgl.dylib | awk '{print $3}' | grep -v '^_wmgl_')"

      - name: Verify source and artifact gates
        run: ./scripts/verify-source.sh

      - name: Forbid conformance-test identifiers in driver sources
        run: ./scripts/check-forbidden-identifiers.sh

      - name: Verify x86_64 macOS artifact
        run: |
          test "$(/usr/bin/lipo -archs build/release/libwinemetalgl.dylib)" = x86_64
          minos="$(otool -l build/release/libwinemetalgl.dylib | awk '/LC_BUILD_VERSION/{found=1} found && /minos/{print $2; exit}')"
          test "$minos" = 15.0

      - name: Upload x86_64 core
        uses: actions/upload-artifact@v7
        with:
          name: winemetalgl-x86_64-macos15
          path: build/release/libwinemetalgl.dylib
          if-no-files-found: error

  arm64-host:
    name: arm64 host build (build only)
    runs-on: macos-15
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure for the build machine
        run: cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release -DWMGL_HOST_ONLY=ON

      - name: Build the core and tests
        run: cmake --build build/host --parallel 4

      - name: Run core host tests
        run: ./build/host/wmgl_host_tests

      - name: Check the architecture
        run: test "$(/usr/bin/lipo -archs build/host/libwinemetalgl.dylib)" = arm64

  wine-module:
    name: Wine module (x86_64 + i386 PE, x86_64 unix)
    runs-on: macos-15
    env:
      LLVM_MINGW: llvm-mingw-20260922-ucrt-macos-universal
      LLVM_MINGW_SHA256: 52e5f5a7b131021d0c39a37a38fa380a1da7885cd04bd61afd0cd4ecfb8bc1f3
      WINE_SHA256: c07a6857933c1fc60dff5448d79f39c92481c1e9db5aa628db9d0358446e0701
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Fetch llvm-mingw and the Wine 11.0 headers
        run: |
          mkdir -p "$RUNNER_TEMP/deps"
          cd "$RUNNER_TEMP/deps"
          curl -fsSL -o llvm-mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/$LLVM_MINGW.tar.xz"
          echo "$LLVM_MINGW_SHA256  llvm-mingw.tar.xz" | shasum -a 256 -c -
          tar -xJf llvm-mingw.tar.xz
          curl -fsSL -o wine.tar.xz https://dl.winehq.org/wine/source/11.0/wine-11.0.tar.xz
          echo "$WINE_SHA256  wine.tar.xz" | shasum -a 256 -c -
          tar -xJf wine.tar.xz wine-11.0/include
          echo "$RUNNER_TEMP/deps/$LLVM_MINGW/bin" >> "$GITHUB_PATH"

      - name: Build the module
        run: sh scripts/build-wine-module.sh "$RUNNER_TEMP/deps/wine-11.0"

      - name: Check the module
        run: |
          m=build/wine-module
          test "$(/usr/bin/lipo -archs $m/x86_64-unix/winemetalgl.so)" = x86_64
          nm -gU $m/x86_64-unix/winemetalgl.so | grep -q ' ___wine_unix_call_funcs$'
          nm -gU $m/x86_64-unix/winemetalgl.so | grep -q ' ___wine_unix_call_wow64_funcs$'
          for arch in x86_64 i386; do
            dd if=$m/$arch-windows/winemetalgl.dll bs=1 skip=64 count=16 2>/dev/null | grep -q 'Wine builtin DLL'
            test -s $m/$arch-windows/opengl32.dll
          done

      - name: Upload the module
        uses: actions/upload-artifact@v7
        with:
          name: winemetalgl-wine-module
          path: |
            build/wine-module/x86_64-windows/*.dll
            build/wine-module/i386-windows/*.dll
            build/wine-module/x86_64-unix/winemetalgl.so
          if-no-files-found: error

  settings-app:
    name: WineMetalGL Settings (app and disk image, ad hoc)
    # Liquid Glass needs Xcode 26, as in the release.
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build, sign ad hoc and make the disk image
        run: |
          set -euo pipefail
          scripts/build-settings-app.sh "$RUNNER_TEMP/app"
          app="$RUNNER_TEMP/app/WineMetalGL Settings.app"
          scripts/sign-settings-app.sh "$app"
          for f in "GamePatches/SpaceEngine/winemac.so" "GamePatches/Wolfenstein The New Order/xaudio2_7.dll" \
                   "GamePatches/Quake 4/apply-display-modes.sh" "GamePatches/Quake 4/legacy-display-modes.reg" \
                   "GamePatches/Quake 4/autoexec.cfg" "GamePatches/SOURCE-SHA256"; do
            test -f "$app/Contents/Resources/$f" || { echo "missing from the app: $f"; exit 1; }
          done
          codesign --verify --strict "$app/Contents/Resources/GamePatches/Wolfenstein The New Order/xaudio2_7.dll"
          # Every DLL the app carries is signed; this build carries no release.
          find "$app/Contents/Resources" -name '*.dll' -print0 | xargs -0 -n1 codesign --verify --strict
          scripts/build-settings-dmg.sh "$app" "$RUNNER_TEMP/WineMetalGL-Settings.dmg"
          mnt="$RUNNER_TEMP/mnt"
          mkdir -p "$mnt"
          # The runner sometimes refuses a fresh image ("corrupt image") while
          # it is still being scanned: try again, and say what is wrong with it
          # when it stays refused.
          for try in 1 2 3 4 5; do
            hdiutil attach "$RUNNER_TEMP/WineMetalGL-Settings.dmg" -nobrowse -readonly -noautoopen -mountpoint "$mnt" && break
            if test "$try" = 5; then
              ls -l "$RUNNER_TEMP/WineMetalGL-Settings.dmg"
              hdiutil imageinfo "$RUNNER_TEMP/WineMetalGL-Settings.dmg" || true
              hdiutil verify "$RUNNER_TEMP/WineMetalGL-Settings.dmg" || true
              codesign -dvvv "$RUNNER_TEMP/WineMetalGL-Settings.dmg" || true
              exit 1
            fi
            sleep $((try * 5))
          done
          test -L "$mnt/Applications"
          codesign --verify --strict --deep "$mnt/WineMetalGL Settings.app"
          hdiutil detach "$mnt"

      - name: Keep the disk image when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: winemetalgl-settings-dmg
          path: ${{ runner.temp }}/WineMetalGL-Settings.dmg
          if-no-files-found: ignore
