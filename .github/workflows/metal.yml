name: Metal

# The core on a Metal device: the GPU tests draw, compute and read back
# through Metal on the runner's Apple silicon GPU (the build workflow
# compiles and runs the host tests only).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winemetalgl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-tests:
    name: Metal GPU tests (Apple silicon)
    runs-on: macos-15
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure for the build machine
        run: cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release -DWMGL_HOST_ONLY=ON

      - name: Build the core and tests
        run: cmake --build build/host --parallel 4

      - name: Show the Metal device
        # The core's view of it: the runner's virtual GPU (macOS 15) takes
        # the fallbacks of docs/unsupported.md#macos-15 (lodBias=0,
        # offsets16=1), and every GPU test is required with them.
        run: |
          WINEMETALGL_LOG=2 ./build/host/wmgl_gpu_tests gpu_version_string 2>&1 | grep "winemetalgl:info: device"

      - name: Run the GPU tests
        run: ./build/host/wmgl_gpu_tests

      - name: Run the draw overhead benchmark
        run: WMGL_BENCH=300 ./build/host/wmgl_gpu_tests bench_draw_overhead
