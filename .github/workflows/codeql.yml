name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winemetalgl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (C, C++, Objective-C++)
    runs-on: macos-15
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The vendored glslang and SPIRV-Cross are built before CodeQL starts
      # tracing, so only WineMetalGL's own C, C++ and Objective-C++ is analysed.
      # Xcode's clang (not the SIP-protected /usr/bin shims) so tracing works.
      - name: Build the vendored compilers (not analysed)
        run: |
          export CC="$(xcrun -f clang)" CXX="$(xcrun -f clang++)" OBJCXX="$(xcrun -f clang++)"
          cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release -DWMGL_HOST_ONLY=ON
          cmake --build build/host --parallel 4
          find build/host/CMakeFiles -name '*.o' -delete

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      - name: Build WineMetalGL (analysed)
        run: cmake --build build/host --parallel 4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
